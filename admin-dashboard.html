<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Macchi Mart - Admin Dashboard</title>
<link rel="icon" href="logo.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f4f7f9;
  color:#102f44;
}

.header{
  background:#07344d;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:52px;
  height:52px;
  object-fit:contain;
  background:white;
  border-radius:10px;
  padding:3px;
}

.brand h1{font-size:20px}
.brand p{font-size:12px;opacity:.8;margin-top:3px}

.logout-btn{
  border:0;
  background:#e74c3c;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 16px 50px;
}

.welcome{margin-bottom:20px}
.welcome h2{font-size:26px;margin-bottom:6px}
.welcome p{color:#667784}

.status{
  padding:12px 15px;
  border-radius:8px;
  margin-bottom:20px;
  display:none;
}

.status.success{
  display:block;
  background:#e8f7ee;
  color:#176b3a;
}

.status.error{
  display:block;
  background:#fdeaea;
  color:#a52a2a;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}

.stat-card span{
  font-size:13px;
  color:#71808a;
}

.stat-card strong{
  display:block;
  margin-top:8px;
  font-size:28px;
  color:#0d88ad;
}

.section{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
  margin-bottom:20px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.section-title h3{font-size:20px}

.top-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.primary{background:#0d88ad;color:white}
.green{background:#176b3a;color:white}
.red{background:#e74c3c;color:white}
.gray{background:#e9eef1;color:#294454}

/* FORM */

.product-form{
  display:none;
  border-top:1px solid #e3e8eb;
  padding-top:20px;
}

.product-form.show{display:block}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd6dc;
  border-radius:8px;
  font-size:15px;
  background:white;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.full{grid-column:1/-1}

.check-row{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
  padding:5px 0;
}

.check-row label{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:normal;
}

.check-row input{width:auto}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap;
}

/* PRODUCTS */

.products{
  display:grid;
  gap:14px;
}

.product{
  border:1px solid #e2e8ec;
  border-radius:12px;
  padding:15px;
  display:grid;
  grid-template-columns:70px 1fr 150px 135px;
  gap:15px;
  align-items:center;
}

.product img{
  width:65px;
  height:65px;
  border-radius:10px;
  object-fit:cover;
  background:#f1f1f1;
}

.product-name{
  font-weight:bold;
  font-size:17px;
}

.marathi-name{
  color:#0d88ad;
  font-size:13px;
  margin-top:3px;
}

.category{
  font-size:13px;
  color:#7b8991;
  margin-top:4px;
}

.product-unit{
  font-size:12px;
  color:#687780;
  margin-top:4px;
}

.price-box label{
  display:block;
  font-size:12px;
  margin-bottom:5px;
  color:#687780;
}

.price-input{
  width:100%;
  padding:10px;
  border:1px solid #ccd6dc;
  border-radius:7px;
  font-size:15px;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.actions button{
  border:0;
  padding:9px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.save-btn{background:#0d88ad;color:white}
.edit-btn{background:#f0ad4e;color:#202020}
.delete-btn{background:#e74c3c;color:white}

.stock-on{
  background:#dcf5e6;
  color:#14743b;
}

.stock-off{
  background:#fde2e2;
  color:#a92c2c;
}

.loading{
  padding:30px;
  text-align:center;
  color:#667784;
}

@media(max-width:700px){

  .stats{grid-template-columns:1fr}

  .form-grid{grid-template-columns:1fr}

  .full{grid-column:auto}

  .product{
    grid-template-columns:55px 1fr;
  }

  .product img{
    width:52px;
    height:52px;
  }

  .price-box,
  .actions{
    grid-column:1/-1;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .brand h1{font-size:16px}

  .top-buttons{
    width:100%;
  }

  .top-buttons button{
    flex:1;
  }
}
</style>
</head>

<body>

<header class="header">

<div class="brand">
  <img src="logo.png" alt="The Macchi Mart Logo">

  <div>
    <h1>The Macchi Mart</h1>
    <p>Admin Control Panel</p>
  </div>
</div>

<button id="logoutBtn" class="logout-btn">
  Logout
</button>

</header>


<main class="container">

<section class="welcome">
  <h2>Dashboard</h2>
  <p>Manage products, fish rates and stock.</p>
</section>

<div id="statusMessage" class="status"></div>


<section class="stats">

<div class="stat-card">
  <span>Total Products</span>
  <strong id="totalProducts">0</strong>
</div>

<div class="stat-card">
  <span>In Stock</span>
  <strong id="inStockCount">0</strong>
</div>

<div class="stat-card">
  <span>Out of Stock</span>
  <strong id="outStockCount">0</strong>
</div>

</section>


<!-- PRODUCT MANAGEMENT -->

<section class="section">

<div class="section-title">

  <div>
    <h3>Product Management</h3>
  </div>

  <button id="openAddBtn" class="btn green">
    + Add New Product
  </button>

</div>


<div id="productForm" class="product-form">

<h3 id="formTitle" style="margin-bottom:18px;">
  Add New Product
</h3>

<div class="form-grid">

<div class="form-group">
<label>Product Name *</label>
<input id="productName" type="text" placeholder="Example: Surmai">
</div>

<div class="form-group">
<label>Marathi Name</label>
<input id="marathiName" type="text" placeholder="उदा. सुरमई">
</div>

<div class="form-group">
<label>Category *</label>
<select id="category">
  <option value="Fresh Fish">Fresh Fish</option>
  <option value="Dry Fish">Dry Fish</option>
</select>
</div>

<div class="form-group">
<label>Price / Rate *</label>
<input id="productPrice" type="number" min="0" step="1" value="0">
</div>

<div class="form-group">
<label>Price Type</label>
<select id="priceType">
  <option value="today">Today's Rate</option>
  <option value="fixed">Fixed Rate</option>
</select>
</div>

<div class="form-group">
<label>Unit</label>
<input id="unit" type="text" value="kg" placeholder="kg / 100 pcs">
</div>

<div class="form-group full">
<label>Weight / Quantity Options</label>
<input
  id="options"
  type="text"
  placeholder="250g, 500g, 1kg"
>
</div>

<div class="form-group full">
<label>Image Path</label>
<input
  id="image"
  type="text"
  placeholder="images/surmai.jpg"
>
</div>

<div class="form-group full">
<label>Description</label>
<textarea
  id="description"
  placeholder="Product description..."
></textarea>
</div>

<div class="form-group">
<label>Display Order</label>
<input id="sortOrder" type="number" min="1" value="1">
</div>

<div class="form-group">
<label>Options</label>

<div class="check-row">

<label>
<input id="cleaning" type="checkbox">
Cleaning Available
</label>

<label>
<input id="inStock" type="checkbox" checked>
In Stock
</label>

</div>
</div>

</div>


<div class="form-actions">

<button id="saveProductBtn" class="btn green">
  Save Product
</button>

<button id="cancelFormBtn" class="btn gray">
  Cancel
</button>

</div>

</div>

</section>


<!-- PRODUCTS LIST -->

<section class="section">

<div class="section-title">

<h3>Products & Today's Rates</h3>

<div class="top-buttons">

<button id="refreshBtn" class="btn primary">
  Refresh
</button>

</div>

</div>

<div id="productsContainer" class="products">

<div class="loading">
  Loading products...
</div>

</div>

</section>

</main>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  query,
  orderBy
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyD8kfHBr-Kwc-Jf2HHtyBCllsr4A8ev6f0",
  authDomain: "the-macchi-mart-7be07.firebaseapp.com",
  projectId: "the-macchi-mart-7be07",
  storageBucket: "the-macchi-mart-7be07.firebasestorage.app",
  messagingSenderId: "981386840283",
  appId: "1:981386840283:web:967a71c447387f612564fe",
  measurementId: "G-ZLWDLY3QZ7"
};


const ADMIN_UID =
"uwduM2c4pSY1fRxAjzcZHUOiNZC3";


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


const productsContainer =
document.getElementById("productsContainer");

const statusMessage =
document.getElementById("statusMessage");

const totalProducts =
document.getElementById("totalProducts");

const inStockCount =
document.getElementById("inStockCount");

const outStockCount =
document.getElementById("outStockCount");

const productForm =
document.getElementById("productForm");

const formTitle =
document.getElementById("formTitle");

let editingProductId = null;


/* STATUS */

function showStatus(message,type){

  statusMessage.textContent=message;
  statusMessage.className="status "+type;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  setTimeout(()=>{
    statusMessage.className="status";
  },4000);
}


/* SECURITY */

onAuthStateChanged(auth,async user=>{

  if(!user){
    window.location.href="admin.html";
    return;
  }

  if(user.uid!==ADMIN_UID){

    await signOut(auth);

    alert("Unauthorized administrator.");

    window.location.href="admin.html";
    return;
  }

  await loadProducts();

});


/* LOAD */

async function loadProducts(){

  productsContainer.innerHTML=
  '<div class="loading">Loading products...</div>';

  try{

    let snapshot;

    try{

      const q=query(
        collection(db,"products"),
        orderBy("sortOrder")
      );

      snapshot=await getDocs(q);

    }catch(error){

      snapshot=await getDocs(
        collection(db,"products")
      );
    }

    const products=[];

    snapshot.forEach(item=>{

      products.push({
        firestoreId:item.id,
        ...item.data()
      });

    });

    products.sort(
      (a,b)=>
      Number(a.sortOrder||999)-
      Number(b.sortOrder||999)
    );

    renderProducts(products);
    updateStats(products);

  }catch(error){

    console.error(error);

    productsContainer.innerHTML=
    '<div class="loading">Unable to load products.</div>';

    showStatus(
      "Unable to load products.",
      "error"
    );
  }
}


/* RENDER */

function renderProducts(products){

  productsContainer.innerHTML="";

  if(products.length===0){

    productsContainer.innerHTML=
    '<div class="loading">No products found.</div>';

    return;
  }

  products.forEach(product=>{

    const card=document.createElement("div");
    card.className="product";

    const id=product.firestoreId;
    const image=product.image||"logo.png";

    card.innerHTML=`

      <img
        src="${image}"
        alt="${product.name||"Product"}"
        onerror="this.onerror=null;this.src='logo.png';"
      >

      <div>

        <div class="product-name">
          ${product.name||"Unnamed Product"}
        </div>

        ${
          product.marathiName
          ? `<div class="marathi-name">${product.marathiName}</div>`
          : ""
        }

        <div class="category">
          ${product.category||""}
        </div>

        <div class="product-unit">
          ${product.unit ? "Unit: "+product.unit : ""}
        </div>

      </div>


      <div class="price-box">

        <label>Price / Rate</label>

        <input
          class="price-input"
          id="price-${id}"
          type="number"
          min="0"
          step="1"
          value="${Number(product.price||0)}"
        >

      </div>


      <div class="actions">

        <button
          class="save-btn"
          data-save="${id}">
          Save Rate
        </button>

        <button
          class="${
            product.inStock===true
            ? "stock-on"
            : "stock-off"
          }"
          data-stock="${id}"
          data-value="${product.inStock===true}">
          ${
            product.inStock===true
            ? "In Stock"
            : "Out of Stock"
          }
        </button>

        <button
          class="edit-btn"
          data-edit="${id}">
          Edit
        </button>

        <button
          class="delete-btn"
          data-delete="${id}">
          Delete
        </button>

      </div>
    `;

    productsContainer.appendChild(card);
  });


  document.querySelectorAll("[data-save]")
  .forEach(button=>{

    button.addEventListener("click",async()=>{

      await saveRate(
        button.dataset.save
      );

    });

  });


  document.querySelectorAll("[data-stock]")
  .forEach(button=>{

    button.addEventListener("click",async()=>{

      const current=
      button.dataset.value==="true";

      await changeStock(
        button.dataset.stock,
        !current
      );

    });

  });


  document.querySelectorAll("[data-edit]")
  .forEach(button=>{

    button.addEventListener("click",async()=>{

      await editProduct(
        button.dataset.edit
      );

    });

  });


  document.querySelectorAll("[data-delete]")
  .forEach(button=>{

    button.addEventListener("click",async()=>{

      await removeProduct(
        button.dataset.delete
      );

    });

  });

}


/* QUICK RATE */

async function saveRate(id){

  const input=
  document.getElementById(`price-${id}`);

  const price=Number(input.value);

  if(Number.isNaN(price)||price<0){

    showStatus(
      "Please enter a valid rate.",
      "error"
    );

    return;
  }

  try{

    await updateDoc(
      doc(db,"products",id),
      {price}
    );

    showStatus(
      "Rate updated successfully.",
      "success"
    );

    await loadProducts();

  }catch(error){

    console.error(error);

    showStatus(
      "Unable to update rate.",
      "error"
    );
  }
}


/* STOCK */

async function changeStock(id,newStatus){

  try{

    await updateDoc(
      doc(db,"products",id),
      {inStock:newStatus}
    );

    showStatus(
      newStatus
      ? "Product marked In Stock."
      : "Product marked Out of Stock.",
      "success"
    );

    await loadProducts();

  }catch(error){

    console.error(error);

    showStatus(
      "Unable to update stock.",
      "error"
    );
  }
}


/* OPEN ADD */

document
.getElementById("openAddBtn")
.addEventListener("click",()=>{

  resetForm();

  formTitle.textContent=
  "Add New Product";

  productForm.classList.add("show");

  productForm.scrollIntoView({
    behavior:"smooth"
  });

});


/* EDIT */

async function editProduct(id){

  try{

    const snapshot=
    await getDoc(
      doc(db,"products",id)
    );

    if(!snapshot.exists()){

      showStatus(
        "Product not found.",
        "error"
      );

      return;
    }

    const p=snapshot.data();

    editingProductId=id;

    document.getElementById("productName").value=
    p.name||"";

    document.getElementById("marathiName").value=
    p.marathiName||"";

    document.getElementById("category").value=
    p.category||"Fresh Fish";

    document.getElementById("productPrice").value=
    Number(p.price||0);

    document.getElementById("priceType").value=
    p.priceType||"today";

    document.getElementById("unit").value=
    p.unit||"kg";

    document.getElementById("options").value=
    Array.isArray(p.options)
    ? p.options.join(", ")
    : "";

    document.getElementById("image").value=
    p.image||"";

    document.getElementById("description").value=
    p.description||"";

    document.getElementById("sortOrder").value=
    Number(p.sortOrder||1);

    document.getElementById("cleaning").checked=
    p.cleaning===true;

    document.getElementById("inStock").checked=
    p.inStock!==false;

    formTitle.textContent=
    "Edit Product - "+(p.name||"");

    productForm.classList.add("show");

    productForm.scrollIntoView({
      behavior:"smooth"
    });

  }catch(error){

    console.error(error);

    showStatus(
      "Unable to open product.",
      "error"
    );
  }
}


/* SAVE PRODUCT */

document
.getElementById("saveProductBtn")
.addEventListener("click",saveProduct);


async function saveProduct(){

  const name=
  document.getElementById("productName")
  .value.trim();

  const marathiName=
  document.getElementById("marathiName")
  .value.trim();

  const category=
  document.getElementById("category").value;

  const price=
  Number(
    document.getElementById("productPrice").value
  );

  const priceType=
  document.getElementById("priceType").value;

  const unit=
  document.getElementById("unit")
  .value.trim()||"kg";

  const optionText=
  document.getElementById("options")
  .value.trim();

  const options=
  optionText
  ? optionText
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean)
  : [];

  const image=
  document.getElementById("image")
  .value.trim()||"logo.png";

  const description=
  document.getElementById("description")
  .value.trim();

  const sortOrder=
  Number(
    document.getElementById("sortOrder").value
  )||999;

  const cleaning=
  document.getElementById("cleaning").checked;

  const inStock=
  document.getElementById("inStock").checked;


  if(!name){

    showStatus(
      "Product name is required.",
      "error"
    );

    return;
  }

  if(Number.isNaN(price)||price<0){

    showStatus(
      "Please enter a valid price.",
      "error"
    );

    return;
  }


  const data={
    name,
    marathiName,
    category,
    price,
    priceType,
    unit,
    options,
    image,
    description,
    sortOrder,
    cleaning,
    inStock
  };


  try{

    if(editingProductId){

      await updateDoc(
        doc(
          db,
          "products",
          editingProductId
        ),
        data
      );

      showStatus(
        "Product updated successfully.",
        "success"
      );

    }else{

      /*
        Create safe Firestore document ID
        from product name.
      */

      let documentId=
      name
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"");


      if(!documentId){

        documentId=
        "product-"+Date.now();

      }


      /*
        Prevent accidental overwrite.
      */

      const existing=
      await getDoc(
        doc(db,"products",documentId)
      );


      if(existing.exists()){

        showStatus(
          "A product with this name already exists.",
          "error"
        );

        return;
      }


      await setDoc(
        doc(
          db,
          "products",
          documentId
        ),
        data
      );


      showStatus(
        "New product added successfully.",
        "success"
      );
    }


    resetForm();

    productForm.classList.remove("show");

    await loadProducts();

  }catch(error){

    console.error(error);

    showStatus(
      "Unable to save product.",
      "error"
    );
  }
}


/* DELETE */

async function removeProduct(id){

  try{

    const snapshot=
    await getDoc(
      doc(db,"products",id)
    );

    if(!snapshot.exists()){

      showStatus(
        "Product not found.",
        "error"
      );

      return;
    }

    const product=snapshot.data();


    const confirmed=
    confirm(
      `Delete "${product.name||"this product"}"?\n\nThis will remove it from Firestore.`
    );


    if(!confirmed){
      return;
    }


    await deleteDoc(
      doc(db,"products",id)
    );


    showStatus(
      "Product deleted successfully.",
      "success"
    );


    await loadProducts();

  }catch(error){

    console.error(error);

    showStatus(
      "Unable to delete product.",
      "error"
    );
  }
}


/* RESET */

function resetForm(){

  editingProductId=null;

  document.getElementById("productName").value="";
  document.getElementById("marathiName").value="";
  document.getElementById("category").value="Fresh Fish";
  document.getElementById("productPrice").value="0";
  document.getElementById("priceType").value="today";
  document.getElementById("unit").value="kg";
  document.getElementById("options").value="";
  document.getElementById("image").value="";
  document.getElementById("description").value="";
  document.getElementById("sortOrder").value="1";
  document.getElementById("cleaning").checked=false;
  document.getElementById("inStock").checked=true;

}


/* CANCEL */

document
.getElementById("cancelFormBtn")
.addEventListener("click",()=>{

  resetForm();

  productForm.classList.remove("show");

});


/* STATS */

function updateStats(products){

  totalProducts.textContent=
  products.length;

  const available=
  products.filter(
    p=>p.inStock===true
  ).length;

  inStockCount.textContent=
  available;

  outStockCount.textContent=
  products.length-available;

}


/* REFRESH */

document
.getElementById("refreshBtn")
.addEventListener("click",loadProducts);


/* LOGOUT */

document
.getElementById("logoutBtn")
.addEventListener("click",async()=>{

  await signOut(auth);

  window.location.href=
  "admin.html";

});

</script>

</body>
</html>
