<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Macchi Mart - Admin Dashboard</title>

  <link rel="icon" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #102f44;
    }

    .header {
      background: #07344d;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
      padding: 3px;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 3px;
    }

    .logout-btn {
      border: none;
      background: #e74c3c;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #667784;
    }

    .status {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .status.success {
      display: block;
      background: #e8f7ee;
      color: #176b3a;
    }

    .status.error {
      display: block;
      background: #fdeaea;
      color: #a52a2a;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .stat-card span {
      font-size: 13px;
      color: #71808a;
    }

    .stat-card strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      color: #0d88ad;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .section-title h3 {
      font-size: 20px;
    }

    .section-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .refresh-btn,
    .import-btn {
      border: none;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .refresh-btn {
      background: #0d88ad;
    }

    .import-btn {
      background: #176b3a;
    }

    .import-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .products {
      display: grid;
      gap: 14px;
    }

    .product {
      border: 1px solid #e2e8ec;
      border-radius: 12px;
      padding: 15px;
      display: grid;
      grid-template-columns: 70px 1fr 150px 120px;
      gap: 15px;
      align-items: center;
    }

    .product img {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      object-fit: cover;
      background: #f1f1f1;
    }

    .product-name {
      font-weight: bold;
      font-size: 17px;
    }

    .marathi-name {
      color: #0d88ad;
      font-size: 13px;
      margin-top: 3px;
    }

    .category {
      font-size: 13px;
      color: #7b8991;
      margin-top: 4px;
    }

    .price-box label {
      display: block;
      font-size: 12px;
      margin-bottom: 5px;
      color: #687780;
    }

    .price-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccd6dc;
      border-radius: 7px;
      font-size: 15px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .save-btn {
      border: none;
      padding: 9px;
      border-radius: 7px;
      background: #0d88ad;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .stock-btn {
      border: none;
      padding: 9px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .stock-on {
      background: #dcf5e6;
      color: #14743b;
    }

    .stock-off {
      background: #fde2e2;
      color: #a92c2c;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #667784;
    }

    @media(max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .product {
        grid-template-columns: 55px 1fr;
      }

      .product img {
        width: 52px;
        height: 52px;
      }

      .price-box,
      .actions {
        grid-column: 1 / -1;
      }

      .actions {
        flex-direction: row;
      }

      .actions button {
        flex: 1;
      }

      .brand h1 {
        font-size: 16px;
      }

      .section-actions {
        width: 100%;
      }

      .section-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="brand">
    <img src="logo.png" alt="The Macchi Mart Logo">

    <div>
      <h1>The Macchi Mart</h1>
      <p>Admin Control Panel</p>
    </div>
  </div>

  <button id="logoutBtn" class="logout-btn">
    Logout
  </button>

</header>


<main class="container">

  <section class="welcome">
    <h2>Dashboard</h2>
    <p>Manage fish rates and stock.</p>
  </section>

  <div id="statusMessage" class="status"></div>


  <section class="stats">

    <div class="stat-card">
      <span>Total Products</span>
      <strong id="totalProducts">0</strong>
    </div>

    <div class="stat-card">
      <span>In Stock</span>
      <strong id="inStockCount">0</strong>
    </div>

    <div class="stat-card">
      <span>Out of Stock</span>
      <strong id="outStockCount">0</strong>
    </div>

  </section>


  <section class="section">

    <div class="section-title">

      <h3>Products & Today's Rates</h3>

      <div class="section-actions">

        <button
          id="importProductsBtn"
          class="import-btn"
          type="button"
        >
          + Import Default Products
        </button>

        <button
          id="refreshBtn"
          class="refresh-btn"
          type="button"
        >
          Refresh
        </button>

      </div>

    </div>


    <div id="productsContainer" class="products">

      <div class="loading">
        Loading products...
      </div>

    </div>

  </section>

</main>


<script type="module">

  /* =======================================================
     FIREBASE IMPORTS
  ======================================================= */

  import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    setDoc,
    query,
    orderBy
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  /* =======================================================
     FIREBASE CONFIG
  ======================================================= */

  const firebaseConfig = {
    apiKey: "AIzaSyD8kfHBr-Kwc-Jf2HHtyBCllsr4A8ev6f0",
    authDomain: "the-macchi-mart-7be07.firebaseapp.com",
    projectId: "the-macchi-mart-7be07",
    storageBucket: "the-macchi-mart-7be07.firebasestorage.app",
    messagingSenderId: "981386840283",
    appId: "1:981386840283:web:967a71c447387f612564fe",
    measurementId: "G-ZLWDLY3QZ7"
  };


  const ADMIN_UID =
    "uwduM2c4pSY1fRxAjzcZHUOiNZC3";


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =======================================================

  ======================================================= */

  const DEFAULT_PRODUCTS = [

    {
      documentId: "surmai",
      id: 1,

      marathiName: "सुरमई",
      category: "Fresh Fish",

      options: ["500g", "1kg"],

    },

    {
      documentId: "pomfret",

      category: "Fresh Fish",
      price: 0,
      priceType: "today",

      image: "images/pomfret.jpg",
      description:
        "Fresh Pomfret carefully selected and hygienically packed.",
      options: ["500g", "1kg"],
      cleaning: true,
      inStock: true,
      sortOrder: 2
    },

    {
      documentId: "bangda",
      id: 3,
      name: "Bangda",
      marathiName: "बांगडा",
      category: "Fresh Fish",
      price: 0,
      priceType: "today",
      unit: "kg",
      image: "images/bangda.jpg",
      description:
        "Fresh Bangda with cleaning and cutting option available.",
      options: ["500g", "1kg"],
      cleaning: true,
      inStock: true,
      sortOrder: 3
    },

    {
      documentId: "rawas",
      id: 4,
      name: "Rawas",
      marathiName: "रावस",
      category: "Fresh Fish",
      price: 0,
      priceType: "today",
      unit: "kg",
      image: "images/rawas.jpg",
      description:
        "Fresh Rawas selected for quality and prepared for home delivery.",
      options: ["500g", "1kg"],
      cleaning: true,
      inStock: true,
      sortOrder: 4
    },

    {
      documentId: "bombil",
      id: 5,
      name: "Bombil",
      marathiName: "बॉम्बील",
      category: "Fresh Fish",
      price: 0,
      priceType: "today",
      unit: "kg",
      image: "images/bombil.jpg",
      description:
        "Fresh Bombil cleaned and hygienically packed for your order.",
      options: ["500g", "1kg"],
      cleaning: true,
      inStock: true,
      sortOrder: 5
    },

    {
      documentId: "prawns",
      id: 6,
      name: "Prawns",

      category: "Fresh Fish",
      price: 0,
      priceType: "today",
      unit: "kg",
      image: "images/prawns.jpg",
      description:
        "Fresh prawns with cleaning option available.",
      options: ["250g", "500g", "1kg"],
      cleaning: true,
      inStock: true,
      sortOrder: 6
    },

    {
      documentId: "javla",
      id: 7,
      name: "Javla",
      marathiName: "जावळा",
      category: "Dry Fish",
      price: 320,
      priceType: "fixed",

      image: "images/javla.jpg",
      description:
        "Premium quality Javla, carefully selected and hygienically packed.",
      options: ["250g", "500g", "1kg"],
      cleaning: false,
      inStock: true,
      sortOrder: 7
    },

    {
      documentId: "kardi",
      id: 8,
      name: "Kardi",
      marathiName: "करडी",
      category: "Dry Fish",
      price: 650,
      priceType: "fixed",
      unit: "kg",
      image: "logo.png",
      description:
        "Premium quality dry Kardi with hygienic packaging.",
      options: ["250g", "500g", "1kg"],
      cleaning: false,
      inStock: true,
      sortOrder: 8
    },

    {
      documentId: "dry-bombil",
      id: 9,
      name: "Dry Bombil",
      marathiName: "सुका बॉम्बील",
      category: "Dry Fish",
      price: 480,
      priceType: "fixed",
      unit: "100 pcs",
      image: "images/dry-bombil.jpg",
      description:
        "Premium quality dried Bombil, selected and hygienically packed.",
      options: ["100 pcs"],
      cleaning: false,
      inStock: true,
      sortOrder: 9
    },

    {
      documentId: "sode",
      id: 10,
      name: "Sode / Dry Prawns",
      marathiName: "सोडे / सुकी कोळंबी",
      category: "Dry Fish",
      price: 1750,
      priceType: "fixed",
      unit: "kg",
      image: "images/sode.jpg",
      description:
        "Premium dried prawns selected for quality and hygienically packed.",
      options: ["250g", "500g", "1kg"],
      cleaning: false,
      inStock: true,
      sortOrder: 10
    }

  ];


  /* =======================================================
     ELEMENTS
  ======================================================= */

  const productsContainer =
    document.getElementById("productsContainer");

  const totalProducts =
    document.getElementById("totalProducts");

  const inStockCount =
    document.getElementById("inStockCount");

  const outStockCount =
    document.getElementById("outStockCount");

  const statusMessage =
    document.getElementById("statusMessage");

  const importProductsBtn =
    document.getElementById("importProductsBtn");


  /* =======================================================
     STATUS MESSAGE
  ======================================================= */

  function showStatus(message, type) {

    statusMessage.textContent =
      message;

    statusMessage.className =
      "status " + type;


    setTimeout(() => {

      statusMessage.className =
        "status";

    }, 4000);

  }


  /* =======================================================
     AUTH SECURITY
  ======================================================= */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.href =
          "admin.html";

        return;

      }


      if (
        user.uid !== ADMIN_UID
      ) {

        await signOut(auth);

        alert(
          "Unauthorized administrator."
        );

        window.location.href =
          "admin.html";

        return;

      }


      await loadProducts();

    }
  );


  /* =======================================================
     LOAD PRODUCTS
  ======================================================= */

  async function loadProducts() {

    productsContainer.innerHTML =
      '<div class="loading">Loading products...</div>';


    try {

      let snapshot;


      try {

        const productsQuery =
          query(
            collection(
              db,
              "products"
            ),
            orderBy(
              "sortOrder"
            )
          );


        snapshot =
          await getDocs(
            productsQuery
          );

      } catch (error) {

        snapshot =
          await getDocs(
            collection(
              db,
              "products"
            )
          );

      }


      if (snapshot.empty) {

        productsContainer.innerHTML =
          '<div class="loading">No products found. Use "Import Default Products".</div>';

        updateStats([]);

        return;

      }


      const products = [];


      snapshot.forEach(
        (documentSnapshot) => {

          products.push({

            firestoreId:
              documentSnapshot.id,

            ...documentSnapshot.data()

          });

        }
      );


      products.sort(
        (a, b) =>

          Number(
            a.sortOrder || 999
          ) -

          Number(
            b.sortOrder || 999
          )
      );


      renderProducts(
        products
      );


      updateStats(
        products
      );

    } catch (error) {

      console.error(error);


      productsContainer.innerHTML =
        '<div class="loading">Unable to load products.</div>';


      showStatus(
        "Could not load products from Firestore.",
        "error"
      );

    }

  }


  /* =======================================================
     RENDER PRODUCTS
  ======================================================= */

  function renderProducts(products) {

    productsContainer.innerHTML =
      "";


    products.forEach(
      (product) => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "product";


        const image =
          product.image ||
          "logo.png";


        const firestoreId =
          product.firestoreId;


        card.innerHTML = `

          <img
            src="${image}"
            alt="${product.name || "Product"}"
            onerror="
              this.onerror=null;
              this.src='logo.png';
            "
          >


          <div>

            <div class="product-name">
              ${product.name || "Unnamed Product"}
            </div>

            ${
              product.marathiName

                ? `
                  <div class="marathi-name">
                    ${product.marathiName}
                  </div>
                `

                : ""
            }

            <div class="category">
              ${product.category || ""}
            </div>

          </div>


          <div class="price-box">

            <label>
              Price / Rate
            </label>

            <input
              type="number"
              min="0"
              step="1"
              class="price-input"
              id="price-${firestoreId}"
              value="${Number(product.price || 0)}"
            >

          </div>


          <div class="actions">

            <button
              class="save-btn"
              data-id="${firestoreId}"
            >
              Save Rate
            </button>


            <button
              class="stock-btn ${
                product.inStock === true
                  ? "stock-on"
                  : "stock-off"
              }"
              data-stock-id="${firestoreId}"
              data-stock="${
                product.inStock === true
                  ? "true"
                  : "false"
              }"
            >

              ${
                product.inStock === true
                  ? "In Stock"
                  : "Out of Stock"
              }

            </button>

          </div>

        `;


        productsContainer.appendChild(
          card
        );

      }
    );


    document
      .querySelectorAll(
        ".save-btn"
      )
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            async () => {

              const id =
                button.dataset.id;

              await savePrice(
                id
              );

            }
          );

        }
      );


    document
      .querySelectorAll(
        ".stock-btn"
      )
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            async () => {

              const id =
                button.dataset.stockId;

              const currentStock =
                button.dataset.stock ===
                "true";


              await changeStock(
                id,
                !currentStock
              );

            }
          );

        }
      );

  }


  /* =======================================================
     SAVE PRICE
  ======================================================= */

  async function savePrice(
    productId
  ) {

    const input =
      document.getElementById(
        `price-${productId}`
      );


    const newPrice =
      Number(
        input.value
      );


    if (
      Number.isNaN(
        newPrice
      ) ||
      newPrice < 0
    ) {

      showStatus(
        "Please enter a valid price.",
        "error"
      );

      return;

    }


    try {

      await updateDoc(
        doc(
          db,
          "products",
          productId
        ),
        {
          price: newPrice
        }
      );


      showStatus(
        "Rate updated successfully.",
        "success"
      );


      await loadProducts();

    } catch (error) {

      console.error(error);


      showStatus(
        "Unable to update rate.",
        "error"
      );

    }

  }


  /* =======================================================
     CHANGE STOCK
  ======================================================= */

  async function changeStock(
    productId,
    newStatus
  ) {

    try {

      await updateDoc(
        doc(
          db,
          "products",
          productId
        ),
        {
          inStock:
            newStatus
        }
      );


      showStatus(
        newStatus
          ? "Product marked In Stock."
          : "Product marked Out of Stock.",
        "success"
      );


      await loadProducts();

    } catch (error) {

      console.error(error);


      showStatus(
        "Unable to update stock.",
        "error"
      );

    }

  }


  /* =======================================================
     IMPORT DEFAULT PRODUCTS
  ======================================================= */

  async function importDefaultProducts() {

    const confirmed =
      confirm(
        "Import missing default products into Firestore?\n\nExisting products and their current rates will NOT be overwritten."
      );


    if (!confirmed) {
      return;
    }


    importProductsBtn.disabled =
      true;

    importProductsBtn.textContent =
      "Importing...";


    try {

      /*
        Read existing products first.
      */

      const existingSnapshot =
        await getDocs(
          collection(
            db,
            "products"
          )
        );


      const existingDocumentIds =
        new Set();


      const existingNames =
        new Set();


      existingSnapshot.forEach(
        (documentSnapshot) => {

          existingDocumentIds.add(
            documentSnapshot.id
              .toLowerCase()
          );


          const data =
            documentSnapshot.data();


          if (data.name) {

            existingNames.add(
              String(data.name)
                .trim()
                .toLowerCase()
            );

          }

        }
      );


      let importedCount = 0;

      let skippedCount = 0;


      for (
        const product
        of DEFAULT_PRODUCTS
      ) {

        const documentId =
          product.documentId;


        const normalizedName =
          product.name
            .trim()
            .toLowerCase();


        /*
          Do not overwrite Surmai or any
          other existing product.
        */

        if (
          existingDocumentIds.has(
            documentId.toLowerCase()
          ) ||
          existingNames.has(
            normalizedName
          )
        ) {

          skippedCount += 1;

          continue;

        }


        const {
          documentId:
            ignoredDocumentId,
          ...productData
        } = product;


        await setDoc(
          doc(
            db,
            "products",
            documentId
          ),
          productData
        );


        importedCount += 1;

      }


      showStatus(
        `${importedCount} products imported. ${skippedCount} existing product(s) kept unchanged.`,
        "success"
      );


      await loadProducts();

    } catch (error) {

      console.error(
        error
      );


      showStatus(
        "Unable to import products.",
        "error"
      );

    } finally {

      importProductsBtn.disabled =
        false;

      importProductsBtn.textContent =
        "+ Import Default Products";

    }

  }


  /* =======================================================
     STATS
  ======================================================= */

  function updateStats(
    products
  ) {

    totalProducts.textContent =
      products.length;


    const available =
      products.filter(
        (product) =>
          product.inStock === true
      ).length;


    inStockCount.textContent =
      available;


    outStockCount.textContent =
      products.length -
      available;

  }


  /* =======================================================
     BUTTON EVENTS
  ======================================================= */

  importProductsBtn.addEventListener(
    "click",
    importDefaultProducts
  );


  document
    .getElementById(
      "refreshBtn"
    )
    .addEventListener(
      "click",
      loadProducts
    );


  document
    .getElementById(
      "logoutBtn"
    )
    .addEventListener(
      "click",
      async () => {

        await signOut(
          auth
        );


        window.location.href =
          "admin.html";

      }
    );

</script>

</body>
</html>
