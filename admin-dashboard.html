<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Macchi Mart - Admin Dashboard</title>

  <link rel="icon" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #102f44;
    }

    .header {
      background: #07344d;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
      padding: 3px;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 3px;
    }

    .logout-btn {
      border: none;
      background: #e74c3c;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #667784;
    }

    .status {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .status.success {
      display: block;
      background: #e8f7ee;
      color: #176b3a;
    }

    .status.error {
      display: block;
      background: #fdeaea;
      color: #a52a2a;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .stat-card span {
      font-size: 13px;
      color: #71808a;
    }

    .stat-card strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      color: #0d88ad;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title h3 {
      font-size: 20px;
    }

    .refresh-btn {
      border: none;
      background: #0d88ad;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .products {
      display: grid;
      gap: 14px;
    }

    .product {
      border: 1px solid #e2e8ec;
      border-radius: 12px;
      padding: 15px;
      display: grid;
      grid-template-columns: 70px 1fr 150px 120px;
      gap: 15px;
      align-items: center;
    }

    .product img {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      object-fit: cover;
      background: #f1f1f1;
    }

    .product-name {
      font-weight: bold;
      font-size: 17px;
    }

    .category {
      font-size: 13px;
      color: #7b8991;
      margin-top: 4px;
    }

    .price-box label {
      display: block;
      font-size: 12px;
      margin-bottom: 5px;
      color: #687780;
    }

    .price-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccd6dc;
      border-radius: 7px;
      font-size: 15px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .save-btn {
      border: none;
      padding: 9px;
      border-radius: 7px;
      background: #0d88ad;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .stock-btn {
      border: none;
      padding: 9px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .stock-on {
      background: #dcf5e6;
      color: #14743b;
    }

    .stock-off {
      background: #fde2e2;
      color: #a92c2c;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #667784;
    }

    @media(max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .product {
        grid-template-columns: 55px 1fr;
      }

      .product img {
        width: 52px;
        height: 52px;
      }

      .price-box,
      .actions {
        grid-column: 1 / -1;
      }

      .actions {
        flex-direction: row;
      }

      .actions button {
        flex: 1;
      }

      .header {
        align-items: center;
      }

      .brand h1 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="brand">
    <img src="logo.png" alt="The Macchi Mart Logo">

    <div>
      <h1>The Macchi Mart</h1>
      <p>Admin Control Panel</p>
    </div>
  </div>

  <button id="logoutBtn" class="logout-btn">
    Logout
  </button>

</header>


<main class="container">

  <section class="welcome">
    <h2>Dashboard</h2>
    <p>Manage fish rates and stock.</p>
  </section>

  <div id="statusMessage" class="status"></div>


  <section class="stats">

    <div class="stat-card">
      <span>Total Products</span>
      <strong id="totalProducts">0</strong>
    </div>

    <div class="stat-card">
      <span>In Stock</span>
      <strong id="inStockCount">0</strong>
    </div>

    <div class="stat-card">
      <span>Out of Stock</span>
      <strong id="outStockCount">0</strong>
    </div>

  </section>


  <section class="section">

    <div class="section-title">
      <h3>Products & Today's Rates</h3>

      <button id="refreshBtn" class="refresh-btn">
        Refresh
      </button>
    </div>

    <div id="productsContainer" class="products">

      <div class="loading">
        Loading products...
      </div>

    </div>

  </section>

</main>


<script type="module">

  import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    query,
    orderBy
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyD8kfHBr-Kwc-Jf2HHtyBCllsr4A8ev6f0",
    authDomain: "the-macchi-mart-7be07.firebaseapp.com",
    projectId: "the-macchi-mart-7be07",
    storageBucket: "the-macchi-mart-7be07.firebasestorage.app",
    messagingSenderId: "981386840283",
    appId: "1:981386840283:web:967a71c447387f612564fe",
    measurementId: "G-ZLWDLY3QZ7"
  };


  const ADMIN_UID =
    "uwduM2c4pSY1fRxAjzcZHUOiNZC3";


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  const productsContainer =
    document.getElementById("productsContainer");

  const totalProducts =
    document.getElementById("totalProducts");

  const inStockCount =
    document.getElementById("inStockCount");

  const outStockCount =
    document.getElementById("outStockCount");

  const statusMessage =
    document.getElementById("statusMessage");


  function showStatus(message, type) {

    statusMessage.textContent = message;

    statusMessage.className =
      "status " + type;

    setTimeout(() => {

      statusMessage.className = "status";

    }, 3500);

  }


  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      window.location.href = "admin.html";
      return;

    }


    if (user.uid !== ADMIN_UID) {

      await signOut(auth);

      alert("Unauthorized administrator.");

      window.location.href = "admin.html";

      return;

    }


    loadProducts();

  });


  async function loadProducts() {

    productsContainer.innerHTML =
      '<div class="loading">Loading products...</div>';

    try {

      let snapshot;

      try {

        const productsQuery = query(
          collection(db, "products"),
          orderBy("sortOrder")
        );

        snapshot =
          await getDocs(productsQuery);

      } catch (error) {

        snapshot =
          await getDocs(collection(db, "products"));

      }


      if (snapshot.empty) {

        productsContainer.innerHTML =
          '<div class="loading">No products found.</div>';

        updateStats([]);

        return;

      }


      const products = [];

      snapshot.forEach((documentSnapshot) => {

        products.push({
          id: documentSnapshot.id,
          ...documentSnapshot.data()
        });

      });


      products.sort(
        (a, b) =>
          (a.sortOrder || 999) -
          (b.sortOrder || 999)
      );


      renderProducts(products);

      updateStats(products);

    } catch (error) {

      console.error(error);

      productsContainer.innerHTML =
        '<div class="loading">Unable to load products.</div>';

      showStatus(
        "Could not load products from Firestore.",
        "error"
      );

    }

  }


  function renderProducts(products) {

    productsContainer.innerHTML = "";


    products.forEach((product) => {

      const card =
        document.createElement("div");

      card.className = "product";


      const image =
        product.image || "logo.png";


      card.innerHTML = `

        <img
          src="${image}"
          alt="${product.name || "Product"}"
          onerror="this.onerror=null;this.src='logo.png';"
        >


        <div>

          <div class="product-name">
            ${product.name || "Unnamed Product"}
          </div>

          <div class="category">
            ${product.category || ""}
          </div>

        </div>


        <div class="price-box">

          <label>
            Price / Rate
          </label>

          <input
            type="number"
            min="0"
            step="1"
            class="price-input"
            id="price-${product.id}"
            value="${Number(product.price || 0)}"
          >

        </div>


        <div class="actions">

          <button
            class="save-btn"
            data-id="${product.id}"
          >
            Save Rate
          </button>


          <button
            class="stock-btn ${
              product.inStock
                ? "stock-on"
                : "stock-off"
            }"
            data-stock-id="${product.id}"
            data-stock="${
              product.inStock
                ? "true"
                : "false"
            }"
          >

            ${
              product.inStock
                ? "In Stock"
                : "Out of Stock"
            }

          </button>

        </div>

      `;


      productsContainer.appendChild(card);

    });


    document
      .querySelectorAll(".save-btn")
      .forEach((button) => {

        button.addEventListener(
          "click",
          async () => {

            const id =
              button.dataset.id;

            await savePrice(id);

          }
        );

      });


    document
      .querySelectorAll(".stock-btn")
      .forEach((button) => {

        button.addEventListener(
          "click",
          async () => {

            const id =
              button.dataset.stockId;

            const currentStock =
              button.dataset.stock === "true";

            await changeStock(
              id,
              !currentStock
            );

          }
        );

      });

  }


  async function savePrice(productId) {

    const input =
      document.getElementById(
        `price-${productId}`
      );


    const newPrice =
      Number(input.value);


    if (
      Number.isNaN(newPrice) ||
      newPrice < 0
    ) {

      showStatus(
        "Please enter a valid price.",
        "error"
      );

      return;

    }


    try {

      await updateDoc(
        doc(db, "products", productId),
        {
          price: newPrice
        }
      );


      showStatus(
        "Rate updated successfully.",
        "success"
      );


      await loadProducts();

    } catch (error) {

      console.error(error);

      showStatus(
        "Unable to update rate.",
        "error"
      );

    }

  }


  async function changeStock(
    productId,
    newStatus
  ) {

    try {

      await updateDoc(
        doc(db, "products", productId),
        {
          inStock: newStatus
        }
      );


      showStatus(
        newStatus
          ? "Product marked In Stock."
          : "Product marked Out of Stock.",
        "success"
      );


      await loadProducts();

    } catch (error) {

      console.error(error);

      showStatus(
        "Unable to update stock.",
        "error"
      );

    }

  }


  function updateStats(products) {

    totalProducts.textContent =
      products.length;


    const available =
      products.filter(
        product =>
          product.inStock === true
      ).length;


    inStockCount.textContent =
      available;


    outStockCount.textContent =
      products.length - available;

  }


  document
    .getElementById("refreshBtn")
    .addEventListener(
      "click",
      loadProducts
    );


  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async () => {

        await signOut(auth);

        window.location.href =
          "admin.html";

      }
    );

</script>

</body>
</html>
